        total_with_vat:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
        exchange_rate:
          type: number
          nullable: true
        coupon_code:
          type: string
          nullable: true
        library:
          type: integer
          nullable: true
        note:
          type: string
