openapi: "3.0.3"

info:
  title: Feedco API
  version: "1.0.6"
  description: |
    **Feedco** je integrační API propojující e-commerce platformy s ERP systémem Helios iNuvio.

    API umožňuje:
    - Synchronizaci produktového katalogu (produkty, kategorie, série, ocenění, osoby)
    - Příjem a správu objednávek
    - Dotazování na způsoby dopravy a platby

    ## Autentizace

    Všechny endpointy (kromě `/v1/health`) vyžadují **HTTP Basic Auth**.
    Credentials obdržíte při onboardingu.

    ## Společné principy

    - Všechny odpovědi obsahují `requestId` (UUID) a `ts` (ISO 8601 UTC timestamp).
    - Chybové odpovědi mají konzistentní formát s poli `error`, `message`, `requestId`, `ts`.
    - Stránkování se řídí query parametry `page` (od 1) a `page_size`.
    - Delta synchronizace je podporována přes filtr `changed_since` (ISO 8601 datetime).
    - Request ID lze zadat přes header `X-Request-Id`; pokud chybí, server ho vygeneruje.

    ## Response headers

    Každá odpověď obsahuje tyto custom hlavičky:

    | Header | Popis |
    |--------|-------|
    | `X-Request-Id` | Unikátní ID požadavku |
    | `X-Api-Version` | Verze API (např. `1.0.0`) |
    | `X-Platform` | Platforma (`feedco`) |
    | `X-Backend` | Backend systém (např. `helios`) |
    | `X-Response-Time-Ms` | Doba zpracování v ms |

  contact:
    name: Feedco API Support
    email: api@feedco.cz
    url: https://feedco.cz
  license:
    name: Proprietary

servers:
  - url: https://api.feedco.cz
    description: Produkční server
  - url: http://localhost:8080
    description: Lokální vývoj

tags:
  - name: Health
    description: Stav služby a databáze
  - name: Auth
    description: Informace o aktuálním připojení
  - name: Orders
    description: Správa objednávek
  - name: Products
    description: Produktový katalog
  - name: Categories
    description: Kategorie produktů
  - name: Series
    description: Edice a série
  - name: Awards
    description: Ocenění produktů a osob
  - name: Persons
    description: Osoby (autoři, překladatelé, ilustrátoři, …)
  - name: Shipping
    description: Způsoby dopravy
  - name: Payment
    description: Platební metody

security:
  - basicAuth: []

paths:
  # ──────────────────────────────────────────────
  # Health
  # ──────────────────────────────────────────────
  /v1/health:
    get:
      operationId: getHealth
      summary: Health check
      description: |
        Vrací stav služby a připojení k databázi.
        Nevyžaduje autentizaci.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Služba i databáze OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: Feedco API
                platform: feedco
                backend: helios
                env: production
                version: "1.0.6"
                db: ok
                dbError: null
                requestId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                ts: "2026-03-31T09:00:00+00:00"
        "503":
          description: Databáze nedostupná
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: degraded
                service: Feedco API
                platform: feedco
                backend: helios
                env: production
                version: "1.0.6"
                db: down
                dbError: "Connection refused"
                requestId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                ts: "2026-03-31T09:00:00+00:00"

  # ──────────────────────────────────────────────
  # Me
  # ──────────────────────────────────────────────
  /v1/me:
    get:
      operationId: getMe
      summary: Informace o připojení
      description: |
        Vrací metadata služby, backend info a seznam dostupných capabilities
        pro aktuálně autentizovaného uživatele.
      tags: [Auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Orders
  # ──────────────────────────────────────────────
  /v1/orders:
    post:
      operationId: createOrder
      summary: Vytvoření objednávky
      description: |
        Vytvoří novou objednávku v ERP.

        ### Idempotence

        Pro zajištění bezpečného opakování požadavku přidejte header `Idempotency-Key`.
        Při opakovaném volání se stejným klíčem (do 24 h) server vrátí uloženou odpověď
        bez opětovného vytvoření objednávky.
      tags: [Orders]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
            example:
              order_id: "ESHOP-2026-00451"
              order_number: "ORD-451"
              order_date: "2026-03-31T09:00:00"
              customer:
                first_name: "Jan"
                surname: "Novák"
                company: null
                ico: null
                dic: null
                phone: "+420600000000"
                email: "jan@example.com"
                address:
                  street: "Dlouhá"
                  house_number: "1"
                  street_number: null
                  zip: "11000"
                  city: "Praha"
                  country: "CZ"
              delivery_address:
                name: "Jan Novák"
                company: null
                phone: null
                street: "Dlouhá"
                house_number: "1"
                street_number: null
                zip: "11000"
                city: "Praha"
                country: "CZ"
              shipping:
                method_code: "GLS"
                price_with_vat: 99.0
                vat_rate: 21.0
              payment:
                method_code: "CARD"
                price_with_vat: 0.0
                status: 0
              total_with_vat: 1297.0
              currency: "CZK"
              exchange_rate: 1.0
              library: 1
              coupon_code: null
              note: null
              items:
                - product_id: 757
                  quantity: 2
                  unit_price: 599.0
                  vat_rate: 10.0
                - product_id: 762
                  quantity: 1
                  unit_price: 99.0
                  vat_rate: 21.0
      responses:
        "201":
          description: Objednávka vytvořena
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreateResponse"
              example:
                ok: true
                orderId: 102115
                external_order_id: "ESHOP-2026-00451"
                requestId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                ts: "2026-03-31T09:05:00+00:00"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listOrders
      summary: Seznam objednávek
      description: |
        Vrací stránkovaný seznam objednávek s možností filtrování
        podle data, statusu a času poslední změny.
      tags: [Orders]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: date_from
          in: query
          description: "Filtr: objednávky od data (YYYY-MM-DD)"
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: "Filtr: objednávky do data (YYYY-MM-DD)"
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: "Filtr: status objednávky (např. `010`, `020`, `040`)"
          schema:
            type: string
        - name: changed_since
          in: query
          description: "Delta sync: pouze objednávky změněné od tohoto okamžiku (ISO 8601)"
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Seznam objednávek
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/orders/{order_id}:
    get:
      operationId: getOrder
      summary: Detail objednávky
      description: |
        Vrací kompletní detail objednávky včetně zákaznických údajů,
        doručovací adresy, dopravy, platby a položek s odkazy na e-knihy.
      tags: [Orders]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Detail objednávky
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  order:
                    $ref: "#/components/schemas/OrderDetail"
                  requestId:
                    type: string
                  ts:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/order-statuses:
    get:
      operationId: listOrderStatuses
      summary: Číselník stavů objednávek
      description: Vrací seznam možných stavů objednávek v ERP.
      tags: [Orders]
      responses:
        "200":
          description: Seznam stavů
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/orders/{order_id}/status:
    put:
      operationId: updateOrderStatus
      summary: Aktualizace statusu objednávky
      description: |
        Změní status existující objednávky.
        Volitelně lze přidat poznámku (`note`).
      tags: [Orders]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdateRequest"
            example:
              status: "040"
              note: "Expedováno přes GLS"
      responses:
        "200":
          description: Status aktualizován
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusUpdateResponse"
              example:
                ok: true
                orderId: 102114
                status: "040"
                requestId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                ts: "2026-03-31T09:10:00+00:00"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  # Products
  # ──────────────────────────────────────────────
  /v1/products:
    get:
      operationId: listProducts
      summary: Seznam produktů
      description: |
        Vrací stránkovaný seznam produktů.
        Podporuje filtrování podle primární kategorie a času změny.

        Každý produkt obsahuje vnořená pole:
        - `persons[]` — navázané osoby (autor, překladatel, ilustrátor…)
        - `params[]` — parametry produktu (počet stran, vazba, rozměr…)
        - `tags[]` — štítky (novinka, bestseller, akce…)
        - `order_by` — 9-znakový sort key pro doporučené pořadí katalogu (řadit ASC)
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: category_id
          in: query
          description: "Filtr: přesné ID primární kategorie (nezahrnuje podkategorie)"
          schema:
            type: integer
        - name: changed_since
          in: query
          description: "Delta sync: pouze produkty změněné od tohoto okamžiku (ISO 8601)"
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Seznam produktů
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/products/{product_id}:
    get:
      operationId: getProduct
      summary: Detail produktu
      description: Vrací kompletní detail jednoho produktu.
      tags: [Products]
      parameters:
        - name: product_id
          in: path
          required: true
          description: ID produktu
          schema:
            type: integer
      responses:
        "200":
          description: Detail produktu
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  product:
                    $ref: "#/components/schemas/Product"
                  requestId:
                    type: string
                  ts:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  # Categories
  # ──────────────────────────────────────────────
  /v1/categories:
    get:
      operationId: listCategories
      summary: Seznam kategorií
      description: Vrací stránkovaný seznam kategorií produktů.
      tags: [Categories]
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: page_size
          in: query
          description: Počet záznamů na stránku (výchozí 200, max 1000)
          schema:
            type: integer
            default: 200
            maximum: 1000
        - name: changed_since
          in: query
          description: "Delta sync: pouze kategorie změněné od tohoto okamžiku"
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Seznam kategorií
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  # Series
  # ──────────────────────────────────────────────
  /v1/series:
    get:
      operationId: listSeries
      summary: Seznam sérií a edicí
      description: Vrací stránkovaný seznam sérií a edicí.
      tags: [Series]
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: page_size
          in: query
          description: Počet záznamů na stránku (výchozí 200, max 1000)
          schema:
            type: integer
            default: 200
            maximum: 1000
        - name: changed_since
          in: query
          description: "Delta sync: pouze série změněné od tohoto okamžiku"
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Seznam sérií
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  # Awards
  # ──────────────────────────────────────────────
  /v1/awards:
    get:
      operationId: listAwards
      summary: Seznam ocenění
      description: |
        Vrací stránkovaný seznam ocenění s vazbami na produkty a osoby.
        Vnořené pole `products` a `persons` obsahují navázané entity.
      tags: [Awards]
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: page_size
          in: query
          description: Počet záznamů na stránku (výchozí 200, max 1000)
          schema:
            type: integer
            default: 200
            maximum: 1000
        - name: changed_since
          in: query
          description: "Delta sync: pouze ocenění změněná od tohoto okamžiku"
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Seznam ocenění
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwardsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  # Persons
  # ──────────────────────────────────────────────
  /v1/persons:
    get:
      operationId: listPersons
      summary: Seznam osob
      description: |
        Vrací stránkovaný seznam osob (autoři, editoři, překladatelé,
        ilustrátoři, fotografové, výtvarný doprovod) s medailonky.

        Role osoby u konkrétního produktu je atributem **vazby**
        a najdete ji v `products[].persons[].role`, ne přímo na osobě –
        jedna osoba může u různých produktů figurovat v různých rolích.
      tags: [Persons]
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: page_size
          in: query
          description: Počet záznamů na stránku (výchozí 200, max 1000)
          schema:
            type: integer
            default: 200
            maximum: 1000
        - name: changed_since
          in: query
          description: "Delta sync: pouze osoby změněné od tohoto okamžiku"
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Seznam osob
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/persons/{person_id}:
    get:
      operationId: getPerson
      summary: Detail osoby
      description: Vrací detail jedné osoby (medailonek).
      tags: [Persons]
      parameters:
        - name: person_id
          in: path
          required: true
          description: ID osoby
          schema:
            type: integer
      responses:
        "200":
          description: Detail osoby
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  person:
                    $ref: "#/components/schemas/Person"
                  requestId:
                    type: string
                  ts:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  # Shipping & Payment
  # ──────────────────────────────────────────────
  /v1/shipping-methods:
    get:
      operationId: listShippingMethods
      summary: Způsoby dopravy
      description: Vrací dostupné způsoby dopravy.
      tags: [Shipping]
      responses:
        "200":
          description: Seznam způsobů dopravy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingMethodsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/payment-methods:
    get:
      operationId: listPaymentMethods
      summary: Platební metody
      description: Vrací dostupné platební metody.
      tags: [Payment]
      responses:
        "200":
          description: Seznam platebních metod
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

# ================================================================
# Components
# ================================================================
components:

  # ──────────────────────────────────────────────
  # Security
  # ──────────────────────────────────────────────
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Auth. Credentials obdržíte při onboardingu.

  # ──────────────────────────────────────────────
  # Parameters
  # ──────────────────────────────────────────────
  parameters:
    Page:
      name: page
      in: query
      description: Číslo stránky (od 1)
      schema:
        type: integer
        default: 1
        minimum: 1

    PageSize:
      name: page_size
      in: query
      description: Počet záznamů na stránku (výchozí 50, max 200)
      schema:
        type: integer
        default: 50
        maximum: 200

    OrderId:
      name: order_id
      in: path
      required: true
      description: ID objednávky
      schema:
        type: integer

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Klíč pro idempotentní vytvoření objednávky.
        Při opakovaném volání se stejným klíčem (do 24 h) se vrátí
        uložená odpověď bez opětovného vytvoření.
      schema:
        type: string

  # ──────────────────────────────────────────────
  # Responses (reusable errors)
  # ──────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Neplatné nebo chybějící credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: unauthorized
            message: Invalid credentials
            requestId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
            ts: "2026-03-31T09:00:00+00:00"

    BadRequest:
      description: Chybný požadavek
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: bad_request
            message: "Body must be a JSON object"
            requestId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
            ts: "2026-03-31T09:00:00+00:00"

    NotFound:
      description: Záznam nenalezen
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: not_found
            message: "Order 999999 not found"
            requestId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
            ts: "2026-03-31T09:00:00+00:00"

    InternalError:
      description: Interní chyba serveru
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponseWithDetails"
          example:
            error: internal_error
            message: "Order creation failed"
            details: "Connection timeout"
            requestId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
            ts: "2026-03-31T09:00:00+00:00"

  # ──────────────────────────────────────────────
  # Schemas
  # ──────────────────────────────────────────────
  schemas:

    # --- Common ---

    ErrorResponse:
