    # --- Products ---

    Product:
      type: object
      description: Produkt z katalogu
      properties:
        product_id:
          type: integer
          description: ID produktu
          example: 757
        parent_product_id:
          type: integer
          nullable: true
          description: ID rodičovského produktu (pro varianty)
        category_id:
          type: integer
          description: ID primární kategorie
          example: 12
        alternative_category_ids:
          type: string
          nullable: true
          description: Alternativní kategorie (formát závisí na backendu)
        series_id:
          type: integer
          nullable: true
          description: ID série / edice
          example: 202
        code:
          type: string
          description: Kód produktu (SKU)
          example: "100000011"
        name:
          type: string
          description: Název produktu
          example: "Nezaručené pověsti / Čiary života"
        subtitle:
          type: string
          description: Podtitul
        original_name:
          type: string
          description: Původní název (u překladů)
        description_short:
          type: string
          description: Krátký popis
        description_long:
          type: string
          description: Dlouhý popis (může obsahovat HTML)
        reviews:
          type: string
          nullable: true
          description: Recenze / ohlasy (může obsahovat HTML)
        ean:
          type: string
          description: EAN kód
          example: "9788090212701"
        price:
          type: string
          description: Koncová cena (CZK)
          example: "67"
        price_b2b:
          type: string
          description: B2B cena (CZK)
          example: "55"
        vat_rate:
          type: string
          description: Sazba DPH
          example: "0.00"
        stock_quantity:
          type: string
          description: |
            Skladová zásoba. Záporné hodnoty indikují neskladové položky
            nebo neomezený sklad (závisí na konfiguraci).
          example: "-9999.000000"
        unit:
          type: string
          description: Jednotka
          example: "ks"
        isbn:
          type: string
          description: ISBN
          example: "80-902127-0-0"
        active:
          type: boolean
          description: Aktivní produkt
        updated_at:
          type: string
          format: date-time
          description: Datum poslední aktualizace
        order_by:
          type: string
          description: |
            9-znakový sort key pro doporučené pořadí v katalogu –
            řadit ASC. Pod kapotou kombinuje skladovost / ruční pořadí /
            vazbu / rok vydání / podpis; klient ho jen převezme,
            žádný další výklad nepotřebuje.
          example: "001022024"
        persons:
          type: array
          nullable: true
          description: |
            Osoby navázané na produkt s konkrétní rolí. Stejná osoba
            může u jiného produktu figurovat v jiné roli – `role` patří
            **vazbě**, ne osobě. Detail osoby (medailonek) lze dotáhnout
            přes `GET /v1/persons/{person_id}`.
          items:
            type: object
            required: [person_id, role]
            properties:
              person_id:
                type: integer
                description: ID osoby
                example: 123
              role:
                type: string
                description: Kód role osoby u produktu z pevného číselníku
                enum: [author, editor, translator, illustrator, photographer, artistic_contributor]
                example: "author"
              name:
                type: string
                nullable: true
                description: Křestní jméno (pro display)
                example: "Jan"
              surname:
                type: string
                nullable: true
                description: Příjmení (pro display)
                example: "Novák"
        params:
          type: array
          nullable: true
          description: |
            Parametry produktu (key-value). Vrací se jen parametry s nenulovou hodnotou.
            Možné názvy: Počet stran, Rozměr, Vydání (pořadí), Publikace (ukončený prodej),
            Vazba, Datum vydání, Pořadí v sérii.
          items:
            type: object
            properties:
              name:
                type: string
                description: Název parametru
                example: "Počet stran"
              value:
                type: string
                description: Hodnota parametru (vždy string)
                example: "320"
        tags:
          type: array
          nullable: true
          description: |
            Štítky produktu. Vrací se jen aktivní štítky.
            Možné hodnoty: Připravujeme, Předobjednávka, Novinka, Akce, Bestseller.
          items:
            type: object
            properties:
              name:
                type: string
                description: Název štítku
                example: "Novinka"

