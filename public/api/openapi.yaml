        capabilities:
          type: object
          description: Mapa dostupných operací
        requestId:
          type: string
        ts:
          type: string
          format: date-time

    # --- Orders ---

    OrderCreateRequest:
      type: object
      description: |
        Payload pro vytvoření objednávky. Celý objekt je předán
        do SQL procedury jako JSON string.
      required: [order_id, items]
      properties:
        order_id:
          type: string
          description: Unikátní identifikátor objednávky v e-shopu (slouží zároveň jako idempotency key)
          example: "ESHOP-2026-00451"
        order_number:
          type: string
          nullable: true
          description: Číslo objednávky pro zobrazení (Cislo)
          example: "ORD-451"
        order_date:
          type: string
          format: date-time
          description: Datum a čas objednávky (ISO 8601). Pokud chybí, použije se čas přijetí.
          example: "2026-03-31T09:00:00"
        customer:
          type: object
          properties:
            first_name:
              type: string
              example: "Jan"
            surname:
              type: string
              example: "Novák"
            company:
              type: string
              nullable: true
            ico:
              type: string
              nullable: true
            dic:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
              example: "+420600000000"
            email:
              type: string
              format: email
              example: "jan@example.com"
            address:
              type: object
              properties:
                street:
                  type: string
                  example: "Dlouhá"
                house_number:
                  type: string
                  description: Číslo popisné
                  example: "1"
                street_number:
                  type: string
                  nullable: true
                  description: Číslo orientační
                  example: "2a"
                zip:
                  type: string
                  example: "11000"
                city:
                  type: string
                  example: "Praha"
                country:
                  type: string
                  description: ISO 3166-1 alpha-2
                  example: "CZ"
        delivery_address:
          type: object
          description: Doručovací adresa (pokud se liší od fakturační)
          properties:
            name:
              type: string
              nullable: true
              example: "Jan Novák"
            company:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            street:
              type: string
              nullable: true
            house_number:
              type: string
              nullable: true
            street_number:
              type: string
              nullable: true
            zip:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
        shipping:
          type: object
          properties:
            method_code:
              type: string
              description: Kód způsobu dopravy (z GET /v1/shipping-methods)
              example: "GLS"
            price_with_vat:
              type: number
              description: Cena dopravy s DPH
              example: 99.0
            vat_rate:
              type: number
              description: Sazba DPH dopravy (%)
              example: 21.0
        payment:
          type: object
          properties:
            method_code:
              type: string
              description: Kód platební metody (z GET /v1/payment-methods)
              example: "CARD"
            price_with_vat:
              type: number
              description: Cena platby s DPH
              example: 0.0
            status:
              type: integer
              description: "Stav platby: 0 = nezaplaceno, 1 = zaplaceno"
              example: 0
        total_with_vat:
          type: number
          description: Celková cena objednávky s DPH
          example: 1297.0
        currency:
          type: string
          description: Kód měny (ISO 4217)
          example: "CZK"
        exchange_rate:
          type: number
          description: Kurz měny (1 = CZK)
          example: 1.0
        library:
          type: integer
          nullable: true
          description: ID knihovny / skladu
          example: 1
        coupon_code:
          type: string
          nullable: true
          description: Slevový poukaz
        note:
          type: string
          nullable: true
          description: Poznámka k objednávce
        items:
          type: array
          description: Položky objednávky
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: integer
                description: ID produktu (z GET /v1/products)
                example: 757
              quantity:
                type: number
                description: Množství
                minimum: 0.000001
                example: 2
              unit_price:
                type: number
                description: Jednotková cena s DPH
                example: 599.0
              vat_rate:
                type: number
                description: Sazba DPH (%)
                example: 10.0

    OrderCreateResponse:
      type: object
