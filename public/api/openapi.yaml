        error:
          type: string
          nullable: true
          description: Text chyby zpracování
        total_with_vat:
          type: number
          nullable: true
          description: Celková cena s DPH
        currency:
          type: string
          nullable: true
          example: "CZK"
        pickup_point:
          type: string
          nullable: true
          description: Výdejní místo
        tracking_number:
          type: string
          nullable: true
          description: Číslo zásilky
        tracking_url:
          type: string
          nullable: true
          description: Odkaz na sledování zásilky
        processed_at:
          type: string
          format: date-time
          nullable: true
          description: Datum zpracování do Heliosu
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    OrderDetail:
      type: object
